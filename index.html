<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/zlogo.gif">
    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"
        integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- STYLE -->
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
    <title>Encriptador</title>
</head>

<body>
    <main>
        <header>
            <img src="img/zlogo.gif" alt="Logo">
            <img class="cora" src="img/corazon.png" alt="">
        </header>

        <section class="input-section">
            <div class="content-input">
                <!-- TEXT AREA -->
                <div class="wrap-text section_8bit">
                    <div class="wrapper">
                        <textarea class="text-en" id="text-en" rows="10" placeholder="Ingrese el texto aquí" aria-label="Texto a encriptar o desencriptar"></textarea>
                    </div>
                    <!-- ALERT NO TEXT (centrada sobre el campo de entrada) -->
                    <div class="alert-text" id="alert-text" role="alert">
                        <div class="wrapper-alertT">
                            <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
                            <p>¡Primero ingresa un texto!</p>
                        </div>
                    </div>
                </div>
                <div class="button-wrap">

                    <div class="wrap-span">
                        <span><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>Solo letras sin acentos ni caracteres especiales</span>
                    </div>
                    <!-- BOTONES ENCRIPTAR Y DESENCRIPTAR -->
                    <div class="button">
                        <div class="btn8bitE">
                            <div class="wrapper-buttonE">
                                <button class="btnEncriptar" id="btnEncriptar"><i class="fa-solid fa-lock" aria-hidden="true"></i>Encriptar</button>
                            </div>
                        </div>
                        <div class="btn8bitD">
                            <div class="wrapper-buttonD">
                                <button class="btnDesencriptar" id="btnDesencriptar"><i class="fa-solid fa-lock-open" aria-hidden="true"></i>Desencriptar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECTION TEXT -->
        <section class="view-text">
            <div class="content-viewT section_8bit" id="content-viewT" aria-live="polite">

                <div class="wrapper">
                    <!-- IMAGE TEXT VIEW -->
                    <div class="wrap-image">
                        <img src="img/escudo.gif" alt="">
                    </div>
                    <div class="wrap-textView">
                        <h2>Ningún mensaje encontrado</h2>
                        <p>Ingresa el texto que desees encriptar o desencriptar</p>
                    </div>
                </div>
            </div>

            <div class="content-view2 section_8bit" id="content-view2">
                <div class="wrapper">
                    <!-- IMAGE TEXT VIEW -->
                    <div class="wrap-textA">
                        <textarea class="text-right" id="text-right" readonly aria-label="Resultado"></textarea>
                    </div>
                    <div class="wrap-btnCopy">
                        <div class="btn8bit-copy">
                            <div class="wrap-btncopy">
                                <button class="btnCopiar" id="btnCopiar"><i class="fa-solid fa-copy" aria-hidden="true"></i>Copiar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- BUTTON DELETE -->
        <button class="btn-Borrar" id="btn-Borrar" aria-label="Borrar texto"><img src="img/tacha.png" alt=""></button>

        <!------------------ ALERT --------------->
        <!-- ALERT ERROR -->
        <div class="alert-wrap" id="alert-wrap">
            <div class="error-color"> </div>
            <div class="alert-error" id="alert-error" role="alertdialog" aria-labelledby="alert-error-title" aria-describedby="alert-error-desc">
                <div class="wrapper-alert">
                    <img src="img/pollo.gif" alt="">
                    <h2 id="alert-error-title">Error</h2>
                    <p id="alert-error-desc">Solo letras sin acentos ni caracteres especiales</p>
                    <button class="btn-alert" id="btn-alert">Aceptar</button>
                </div>
            </div>
        </div>

        <!-- ALERT  COPY-->
        <div class="alert-copy" id="alert-copy" role="status">
            <img src="img/espada.png" alt="">
            <p>Texto copiado!</p>
        </div>

        <!------------------ ALERT --------------->
    </main>

    <footer>
        <p>Desarrollado por Francisco Figueroa</p>
        <a href="https://github.com/JavierFig0/Encriptador-de-texto" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><i class="fa-brands fa-github" aria-hidden="true"></i></a>
        <a href="https://www.linkedin.com/in/francisco-figueroa-wd/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><i class="fa-brands fa-linkedin" aria-hidden="true"></i></a>
    </footer>

    <script src="main.js"></script>
</body>

</html>
